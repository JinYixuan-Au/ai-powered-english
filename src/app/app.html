<main>
  <section class="opening" aria-labelledby="opening-title">
    <div class="opening__stage">
      <div class="opening__atmosphere" aria-hidden="true">
        <span class="opening__glow"></span>
        <span class="opening__horizon"></span>
        <span class="opening__line opening__line--one"></span>
        <span class="opening__line opening__line--two"></span>
      </div>

      <header class="masthead reveal reveal--school">
        <span class="masthead__mark" aria-hidden="true">J</span>
        <p>The High School Affiliated to Xi'an Jiaotong University</p>
      </header>

      <div class="opening__content">
        <p class="eyebrow reveal reveal--eyebrow">Your journey starts here.</p>
        <h1 id="opening-title" class="reveal reveal--title">
          Welcome to<br />
          <span>Senior High School.</span>
        </h1>
        <p class="opening__statement reveal reveal--statement">
          Your English journey begins here.
        </p>
      </div>

      <a class="journey-link reveal reveal--cta" href="#world-intro">
        <span>Begin the Journey</span>
        <span class="journey-link__arrow" aria-hidden="true">↓</span>
      </a>

      <div class="opening__transition" aria-hidden="true"></div>
    </div>
  </section>

  <app-world-journey />
</main>
